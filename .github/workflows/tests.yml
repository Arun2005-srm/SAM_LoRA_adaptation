name: Tests and CPU smoke
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python smoke.py --output runs/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: |
            runs/ci_smoke/smoke_result.json
            runs/ci_smoke/run/**/*.png
            runs/ci_smoke/run/**/*.json
            runs/ci_smoke/run/**/*.csv
